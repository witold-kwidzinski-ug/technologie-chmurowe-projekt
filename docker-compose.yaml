services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER_FILE=/run/secrets/db_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_user
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - "${PWD}/init.sql:/docker-entrypoint-initdb.d/init.sql"
    networks:
      - backend-net
      - db-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/db_user)"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  backend:
    image: wkwidzinski/projekt-backend:v1
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - DB_HOST=${DB_HOST}
      - DB_DATABASE=${DB_DATABASE}
      - DB_PORT=${DB_PORT}
    stop_grace_period: 10s
    secrets:
      - db_user
      - db_password
    networks:
      - frontend-net
      - backend-net
      - db-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  frontend:
    image: wkwidzinski/projekt-frontend:v1
    ports:
      - "80:80"
    networks:
      - frontend-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_started





volumes:
  pgdata:
  redis-data:


secrets:
  db_user:
    file: "./secrets/db_user.txt"
  db_password:
    file: "./secrets/db_password.txt"


networks:
  frontend-net:
  backend-net:
  db-net: